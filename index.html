<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>公歧子的编解码工作台</title>
<meta name="description" content="公歧子的编解码工作台：在线加密解密工具，纯本地运行，不上传任何内容。">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%234f46e5'/><text y='74' x='50' text-anchor='middle' font-size='58' fill='white' font-family='monospace'>公</text></svg>">
<style>
/* ===================== 设计变量 ===================== */
:root{
  --bg:#eef2fb;
  --card:rgba(255,255,255,.86);
  --card-solid:#ffffff;
  --line:rgba(19,26,58,.09);
  --line-strong:rgba(19,26,58,.16);
  --text:#141a33;
  --text-2:#4b5570;
  --text-3:#828da8;
  --brand:#4f46e5;
  --brand-2:#7c3aed;
  --brand-soft:#eef0ff;
  --ok:#0d9488;
  --ok-soft:#e6f7f4;
  --warn:#b45309;
  --warn-soft:#fef4e5;
  --err:#c2410c;
  --err-soft:#fdeee7;
  --radius:18px;
  --radius-sm:11px;
  --shadow:0 1px 2px rgba(19,26,58,.05), 0 12px 32px -12px rgba(19,26,58,.18);
  --mono:ui-monospace,"SF Mono","JetBrains Mono","Cascadia Code",Consolas,"Liberation Mono",monospace;
  --sans:system-ui,-apple-system,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:var(--sans); color:var(--text); background:var(--bg);
  min-height:100vh; -webkit-font-smoothing:antialiased; line-height:1.6; overflow-x:hidden;
}
/* 背景光斑 */
.orb{position:fixed; border-radius:50%; filter:blur(90px); opacity:.5; z-index:0; pointer-events:none}
.orb.a{width:46vw;height:46vw;left:-12vw;top:-14vw;background:radial-gradient(circle at 30% 30%,#c7d2fe,#e0e7ff 60%,transparent 72%)}
.orb.b{width:38vw;height:38vw;right:-10vw;top:8vh;background:radial-gradient(circle at 60% 40%,#ddd6fe,#ede9fe 60%,transparent 72%)}
.orb.c{width:40vw;height:40vw;left:24vw;bottom:-20vw;background:radial-gradient(circle at 50% 50%,#bfdbfe,#e0f2fe 60%,transparent 72%)}

/* ===================== 布局 ===================== */
.wrap{position:relative; z-index:1; max-width:1240px; margin:0 auto; padding:40px 22px 72px}

/* -------- 头部 -------- */
.hero{display:flex; flex-wrap:wrap; gap:26px; align-items:center; justify-content:space-between; margin-bottom:26px}
.brand{display:flex; align-items:center; gap:15px}
.logo{
  width:56px;height:56px;border-radius:16px;flex:none;
  background:linear-gradient(140deg,var(--brand),var(--brand-2));
  color:#fff;display:grid;place-items:center;font:700 26px/1 var(--sans);
  box-shadow:0 12px 26px -10px rgba(79,70,229,.75);
}
.brand h1{margin:0;font-size:27px;letter-spacing:-.4px;font-weight:750}

/* -------- 卡片 -------- */
.card{
  background:var(--card); backdrop-filter:blur(16px);
  border:1px solid var(--line); border-radius:var(--radius);
  box-shadow:var(--shadow); margin-bottom:20px;
}
.card-pad{padding:20px 22px}
.card-title{
  display:flex;align-items:center;gap:10px;margin:0 0 15px;
  font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--text-3);
}
.card-title .bar{width:3px;height:14px;border-radius:2px;background:linear-gradient(180deg,var(--brand),var(--brand-2))}

/* -------- 模式选择 -------- */
.seg{position:relative;display:grid;grid-template-columns:repeat(3,1fr);gap:6px;
  background:#eaeefb;border-radius:14px;padding:6px;border:1px solid var(--line)}
.seg .thumb{
  position:absolute;top:6px;bottom:6px;left:6px;width:calc(33.3333% - 4px);border-radius:10px;
  background:var(--card-solid);box-shadow:0 2px 10px -2px rgba(45,32,120,.28);
  transition:left .28s cubic-bezier(.4,0,.2,1);
}
.seg button{
  position:relative;z-index:1;border:0;background:transparent;cursor:pointer;
  padding:11px 6px;border-radius:10px;font:inherit;font-size:13.5px;font-weight:600;
  color:var(--text-2);transition:color .2s;
}
.seg button[aria-selected="true"]{color:var(--brand)}

/* -------- 密钥区 -------- */
.key-row{display:flex;gap:12px;align-items:flex-end;margin-top:16px;flex-wrap:wrap}
.field{flex:1 1 260px;min-width:220px}
.field label{display:block;font-size:12.5px;font-weight:650;color:var(--text-2);margin-bottom:6px}
.input-wrap{position:relative;display:flex;align-items:center}
.input-wrap input{
  width:100%;padding:11px 42px 11px 14px;border-radius:var(--radius-sm);
  border:1px solid var(--line-strong);background:#fff;font:inherit;font-size:14px;color:var(--text);
  transition:border-color .18s,box-shadow .18s;
}
.input-wrap input:focus{outline:0;border-color:var(--brand);box-shadow:0 0 0 4px rgba(79,70,229,.13)}
.input-wrap input:disabled{background:#f4f6fb;color:var(--text-3);cursor:not-allowed}
.eye{
  position:absolute;right:6px;width:32px;height:32px;border:0;border-radius:8px;
  background:transparent;cursor:pointer;font-size:15px;color:var(--text-3);display:grid;place-items:center;
}
.eye:hover{background:#f0f2f9;color:var(--text-2)}
.eye:disabled{cursor:not-allowed;opacity:.4}
.field.disabled label{color:var(--text-3)}

/* -------- 按钮 -------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  border:1px solid var(--line-strong);background:#fff;color:var(--text-2);
  padding:11px 16px;border-radius:var(--radius-sm);font:inherit;font-size:13.5px;font-weight:600;
  cursor:pointer;transition:all .18s;white-space:nowrap;
}
.btn:hover{background:#f7f8fd;color:var(--text)}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.btn.ghost{background:transparent;border-color:transparent;color:var(--text-3)}
.btn.ghost:hover{background:#f0f2f9;color:var(--text-2)}
.btn.sm{padding:7px 12px;font-size:12.5px;border-radius:9px}

/* -------- 工作区双栏 -------- */
.io{display:grid;grid-template-columns:1fr auto 1fr;align-items:stretch}
.pane{display:flex;flex-direction:column;min-width:0;padding:16px 18px}
.pane + .pane{border-left:1px solid var(--line)}
.pane-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px;min-height:26px}
.pane-head h2{margin:0;font-size:13.5px;font-weight:700;display:flex;align-items:center;gap:8px}
.pane-head .tag{
  font-size:11px;font-weight:600;padding:3px 9px;border-radius:999px;
  background:var(--brand-soft);color:var(--brand);font-family:var(--mono);
}
.pane-head .tag.muted{background:#f0f2f9;color:var(--text-3)}
.pane-body{position:relative;flex:1;display:flex}
textarea{
  width:100%;min-height:230px;resize:vertical;padding:14px;border-radius:var(--radius-sm);
  border:1px solid var(--line-strong);background:#fff;font:inherit;font-size:14px;line-height:1.7;
  color:var(--text);transition:border-color .18s,box-shadow .18s;
}
textarea:focus{outline:0;border-color:var(--brand);box-shadow:0 0 0 4px rgba(79,70,229,.13)}
#cipher{font-family:var(--mono);font-size:13.5px;letter-spacing:.02em;word-break:break-all;
  background:#fbfcff;color:#312e81}
.pane-foot{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;align-items:center}
.pane-foot .spacer{flex:1}

/* 中间按钮列 */
.rail{
  display:flex;flex-direction:column;justify-content:center;gap:10px;
  padding:16px 14px;background:linear-gradient(180deg,rgba(238,242,251,.5),rgba(238,242,251,.15));
  border-left:1px solid var(--line);border-right:1px solid var(--line);
}
.arrow-btn{
  display:inline-flex;align-items:center;gap:8px;justify-content:center;
  border:0;border-radius:12px;padding:13px 14px;font:inherit;font-size:13.5px;font-weight:700;
  cursor:pointer;transition:all .2s;width:118px;color:#fff;
}
.arrow-btn.enc{background:linear-gradient(135deg,var(--brand),var(--brand-2));box-shadow:0 10px 22px -11px rgba(79,70,229,.9)}
.arrow-btn.dec{background:linear-gradient(135deg,#0891b2,#0d9488);box-shadow:0 10px 22px -11px rgba(13,148,136,.85)}
.arrow-btn:hover{filter:brightness(1.07);transform:translateY(-1px)}
.arrow-btn:active{transform:translateY(1px)}
.arrow-btn:disabled{opacity:.45;cursor:not-allowed;filter:grayscale(.5)}

/* 提示条 */
.alert{
  display:none;gap:10px;align-items:flex-start;margin:0 18px 18px;padding:12px 14px;
  border-radius:var(--radius-sm);font-size:13px;line-height:1.55;border:1px solid transparent;
}
.alert.show{display:flex}
.alert.ok{background:var(--ok-soft);color:#0f766e;border-color:rgba(13,148,136,.2)}
.alert.warn{background:var(--warn-soft);color:var(--warn);border-color:rgba(180,83,9,.2)}
.alert.err{background:var(--err-soft);color:var(--err);border-color:rgba(194,65,12,.22)}
.alert .ico{flex:none;font-size:15px;line-height:1.4}
.alert code{font-family:var(--mono);background:rgba(255,255,255,.65);padding:1px 5px;border-radius:5px}

/* Toast */
#toast{
  position:fixed;left:50%;bottom:34px;transform:translate(-50%,26px);
  background:#141a33;color:#fff;padding:12px 20px;border-radius:12px;font-size:13.5px;font-weight:550;
  box-shadow:0 20px 44px -16px rgba(20,26,51,.7);opacity:0;pointer-events:none;
  transition:opacity .25s,transform .25s;z-index:99;max-width:88vw;text-align:center;
}
#toast.show{opacity:1;transform:translate(-50%,0)}
#toast.err{background:#9a2c12}
#toast.ok{background:#0f766e}

footer.credits{text-align:center;color:var(--text-3);font-size:12.5px;margin-top:34px;line-height:1.9}

/* 响应式 */
@media (max-width:980px){
  .io{grid-template-columns:1fr}
  .rail{flex-direction:row;flex-wrap:wrap;border:0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:14px 18px;gap:12px}
  .arrow-btn{width:auto;flex:1 1 130px}
  .pane + .pane{border-left:0;border-top:1px solid var(--line)}
  .seg .thumb{display:none}
}
@media (max-width:620px){
  .wrap{padding:26px 14px 56px}
  .brand h1{font-size:22px}
  .card-pad{padding:17px 16px}
  .pane{padding:14px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="orb a"></div><div class="orb b"></div><div class="orb c"></div>

<div class="wrap">
  <header class="hero">
    <div class="brand">
      <div class="logo">公</div>
      <div>
        <h1>公歧子的编解码工作台</h1>
      </div>
    </div>
  </header>

  <!-- ============ 模式 + 密钥 ============ -->
  <section class="card card-pad">
    <h2 class="card-title"><span class="bar"></span>编码模式</h2>
    <div class="seg" id="seg" role="tablist">
      <div class="thumb" id="thumb"></div>
      <button role="tab" data-mode="basic" aria-selected="true">基础编码</button>
      <button role="tab" data-mode="multi" aria-selected="false">多对多</button>
      <button role="tab" data-mode="aes" aria-selected="false">AES 叠加</button>
    </div>

    <div class="key-row">
      <div class="field disabled" id="key-field">
        <label for="key">密钥</label>
        <div class="input-wrap">
          <input id="key" type="password" placeholder="请输入密钥，例如：wo-de-mi-yao-2026" disabled autocomplete="off" spellcheck="false">
          <button class="eye" id="eye" type="button" title="显示 / 隐藏密钥" disabled>👁</button>
        </div>
      </div>
      <button class="btn" id="genkey" type="button" disabled>随机密钥</button>
    </div>
  </section>

  <!-- ============ 工作区 ============ -->
  <section class="card">
    <div class="io">
      <div class="pane">
        <div class="pane-head">
          <h2>📝 明文</h2>
          <span class="tag muted" id="plain-count">0 字</span>
        </div>
        <div class="pane-body">
          <textarea id="plain" placeholder="在这里输入要编码的文字……" spellcheck="false"></textarea>
        </div>
        <div class="pane-foot">
          <button class="btn sm" id="sample" type="button">示例</button>
          <button class="btn sm ghost" id="clear-plain" type="button">清空</button>
          <span class="spacer"></span>
          <button class="btn sm" id="copy-plain" type="button">复制明文</button>
        </div>
      </div>

      <div class="rail">
        <button class="arrow-btn enc" id="do-encrypt" type="button">加密 →</button>
        <button class="arrow-btn dec" id="do-decrypt" type="button">← 解密</button>
      </div>

      <div class="pane">
        <div class="pane-head">
          <h2>🔒 密文</h2>
          <span class="tag" id="cipher-count">0 组</span>
        </div>
        <div class="pane-body">
          <textarea id="cipher" placeholder="加密结果会出现在这里；也可以把别人给的密文粘贴进来解密。" spellcheck="false"></textarea>
        </div>
        <div class="pane-foot">
          <button class="btn sm" id="copy-cipher" type="button">复制密文</button>
          <button class="btn sm ghost" id="clear-cipher" type="button">清空</button>
          <span class="spacer"></span>
          <button class="btn sm" id="download" type="button">导出 TXT</button>
        </div>
      </div>
    </div>
    <div id="alert" class="alert"></div>
  </section>

  <footer class="credits">
    公歧子微信：gongqizi0
  </footer>
</div>

<div id="toast"></div>

<!-- 码书数据 + 核心算法（均由本项目生成 / 提供） -->
<script src="codebook.js"></script>
<script src="bdef-core.js"></script>
<script>
(function(){
"use strict";

/* ================= 依赖核心算法 ================= */
if(!window.BDEF){
  document.body.innerHTML = '<div style="padding:48px;font:16px/1.7 system-ui;color:#c2410c">'
    + '<b>核心脚本 bdef-core.js 未能载入。</b><br>请确认本页面与 codebook.js、bdef-core.js 在同一目录下。</div>';
  return;
}
const codec = BDEF.fromGlobals();
const TOTAL = BDEF.TOTAL;
const hasSubtle = BDEF.aes.hasSubtle;

/* ================= DOM ================= */
const $ = function(id){ return document.getElementById(id); };
const elSeg = $("seg"), elThumb = $("thumb");
const elPlain = $("plain"), elCipher = $("cipher"), elKey = $("key");
const elAlert = $("alert"), elToast = $("toast"), elEye = $("eye");
const elPlainCount = $("plain-count"), elCipherCount = $("cipher-count");

let mode = "basic";

/* ================= 提示 ================= */
let toastTimer = null;
function toast(msg, kind){
  elToast.textContent = msg;
  elToast.className = "show" + (kind ? " " + kind : "");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ elToast.className = ""; }, 2200);
}
function alertBox(kind, html){
  elAlert.className = "alert show " + kind;
  elAlert.innerHTML = '<span class="ico">' + ({ok:"✅",warn:"⚠️",err:"⛔"}[kind] || "ℹ️")
    + '</span><span>' + html + '</span>';
}
function alertHide(){ elAlert.className = "alert"; }

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, function(c){
    return ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[c];
  });
}

/* ================= 模式切换 ================= */
function setMode(next){
  mode = next;
  const btns = elSeg.querySelectorAll("button[data-mode]");
  let idx = 0;
  btns.forEach(function(b, i){
    const on = b.getAttribute("data-mode") === next;
    b.setAttribute("aria-selected", on ? "true" : "false");
    if(on) idx = i;
  });
  elThumb.style.left = "calc(" + (idx * 33.3333) + "% + 6px)";

  const needKey = next !== "basic";
  elKey.disabled = !needKey;
  elEye.disabled = !needKey;
  $("genkey").disabled = !needKey;
  $("key-field").classList.toggle("disabled", !needKey);
}

/* ================= 计数 ================= */
function refreshCounts(){
  const plainN = Array.from(elPlain.value.replace(/\s+/g, "")).length;
  elPlainCount.textContent = plainN + " 字";

  const c = elCipher.value;
  const st = codec.stats(c, mode);
  if(mode === "aes"){
    elCipherCount.textContent = (st.chars ? st.chars + " 位" : "0 位");
  } else {
    elCipherCount.textContent = st.groups + " 组" + (st.noise ? " · " + st.noise + " 噪声" : "");
  }
}

/* ================= 校验 ================= */
function checkKey(){
  if(!elKey.value.trim()){
    alertBox("warn", "<b>请先填写密钥。</b>当前模式没有密钥无法加解密。");
    elKey.focus();
    return false;
  }
  return true;
}
function reportMissing(missing){
  if(missing && missing.length){
    const uniq = Array.from(new Set(missing));
    alertBox("warn", "以下 " + uniq.length + " 个字符不在码书中，<b>已被跳过</b>："
      + uniq.map(function(c){
          return "<code>" + escapeHtml(c === " " ? "␠" : c) + "</code>";
        }).join(" "));
  } else {
    alertBox("ok", "处理完成。");
  }
}

/* ================= 加密 / 解密 ================= */
function doEncrypt(){
  const plain = elPlain.value;
  if(!plain){ toast("请先输入要加密的明文", "err"); elPlain.focus(); return; }
  if(mode !== "basic" && !checkKey()) return;
  if(mode === "aes" && !hasSubtle){
    alertBox("err", "<b>AES 不可用。</b>请通过 HTTPS 或 localhost 打开页面。");
    return;
  }
  let result;
  try{
    if(mode === "basic") result = codec.encodeBasic(plain);
    else if(mode === "multi") result = codec.encode(plain, elKey.value);
    else result = codec.encryptFull(plain, elKey.value);
  }catch(e){
    alertBox("err", "加密失败：" + escapeHtml(e.message)); return;
  }
  Promise.resolve(result).then(function(res){
    elCipher.value = res.text;
    refreshCounts();
    reportMissing(res.missing);
    toast("加密完成", "ok");
  }).catch(function(e){
    alertBox("err", "加密失败：" + escapeHtml(e.message || String(e)));
  });
}

function doDecrypt(){
  const cipher = elCipher.value;
  if(!cipher.trim()){ toast("请先在密文区粘贴密文", "err"); elCipher.focus(); return; }
  if(mode !== "basic" && !checkKey()) return;
  if(mode === "aes" && !hasSubtle){
    alertBox("err", "<b>AES 不可用。</b>请通过 HTTPS 或 localhost 打开页面。"); return;
  }
  let result;
  try{
    if(mode === "basic") result = codec.decodeBasic(cipher);
    else if(mode === "multi") result = codec.decode(cipher, elKey.value);
    else result = codec.decryptFull(cipher, elKey.value);
  }catch(e){
    alertBox("err", "解密失败：" + escapeHtml(e.message)); return;
  }
  Promise.resolve(result).then(function(text){
    elPlain.value = text;
    refreshCounts();
    alertBox("ok", "解密完成，已填入左侧明文区。");
    toast("解密完成", "ok");
  }).catch(function(e){
    alertBox("err", "解密失败：" + escapeHtml(e.message || String(e)));
  });
}

/* ================= 复制 ================= */
function copyText(text, label){
  if(!text){ toast("没有可复制的内容", "err"); return; }
  function fallback(){
    const ta = document.createElement("textarea");
    ta.value = text;
    ta.style.cssText = "position:fixed;top:0;left:0;opacity:0";
    document.body.appendChild(ta); ta.select();
    try{ document.execCommand("copy"); toast(label + "已复制", "ok"); }
    catch(e){ toast("复制失败，请手动选择复制", "err"); }
    finally{ document.body.removeChild(ta); }
  }
  if(navigator.clipboard && window.isSecureContext){
    navigator.clipboard.writeText(text)
      .then(function(){ toast(label + "已复制到剪贴板", "ok"); })
      .catch(fallback);
  } else { fallback(); }
}

/* ================= 示例 ================= */
const SAMPLE = "你好，世界！\n这是一段示例文字，点击「加密 →」看看会发生什么。";

/* ================= 事件绑定 ================= */
elSeg.addEventListener("click", function(e){
  const b = e.target.closest("button[data-mode]");
  if(b) setMode(b.getAttribute("data-mode"));
});
elEye.addEventListener("click", function(){
  const show = elKey.type === "password";
  elKey.type = show ? "text" : "password";
  elEye.textContent = show ? "🙈" : "👁";
});
$("genkey").addEventListener("click", function(){
  const bytes = crypto.getRandomValues(new Uint8Array(12));
  elKey.value = Array.from(bytes).map(function(b){ return b.toString(16).padStart(2, "0"); }).join("");
  elKey.type = "text"; elEye.textContent = "🙈";
  toast("已生成随机密钥，请妥善保存", "ok");
});
$("do-encrypt").addEventListener("click", doEncrypt);
$("do-decrypt").addEventListener("click", doDecrypt);
$("sample").addEventListener("click", function(){ elPlain.value = SAMPLE; refreshCounts(); alertHide(); });
$("clear-plain").addEventListener("click", function(){ elPlain.value = ""; refreshCounts(); alertHide(); });
$("clear-cipher").addEventListener("click", function(){ elCipher.value = ""; refreshCounts(); alertHide(); });
$("copy-plain").addEventListener("click", function(){ copyText(elPlain.value, "明文"); });
$("copy-cipher").addEventListener("click", function(){ copyText(elCipher.value, "密文"); });
$("download").addEventListener("click", function(){
  const now = new Date();
  const p = function(x){ return String(x).padStart(2, "0"); };
  const stamp = now.getFullYear() + p(now.getMonth()+1) + p(now.getDate())
              + "-" + p(now.getHours()) + p(now.getMinutes()) + p(now.getSeconds());
  const modeName = { basic:"基础编码", multi:"多对多", aes:"AES叠加" }[mode];
  const body = "# 公歧子的编解码工作台 导出结果\n"
    + "# 时间：" + now.toLocaleString() + "\n"
    + "# 模式：" + modeName + "\n"
    + (mode === "basic" ? "" : "# 密钥：" + elKey.value + "\n")
    + "\n【明文】\n" + elPlain.value + "\n\n【密文】\n" + elCipher.value + "\n";
  const blob = new Blob([body], { type: "text/plain;charset=utf-8" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "bdef-" + stamp + ".txt";
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(function(){ URL.revokeObjectURL(a.href); }, 1500);
  toast("已导出 TXT", "ok");
});
elPlain.addEventListener("input", refreshCounts);
elCipher.addEventListener("input", refreshCounts);
elPlain.addEventListener("keydown", function(e){
  if((e.ctrlKey || e.metaKey) && e.key === "Enter"){ e.preventDefault(); doEncrypt(); }
});
elCipher.addEventListener("keydown", function(e){
  if((e.ctrlKey || e.metaKey) && e.key === "Enter"){ e.preventDefault(); doDecrypt(); }
});
document.addEventListener("keydown", function(e){ if(e.key === "Escape") alertHide(); });

/* ================= 初始化 ================= */
setMode("basic");
refreshCounts();
if(codec.cb.chars.length === 0){
  alertBox("err", "<b>码书未能载入。</b>请确认 <code>codebook.js</code> 与本页面在同一目录下。");
}
})();
</script>
